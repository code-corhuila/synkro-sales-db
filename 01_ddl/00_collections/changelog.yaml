databaseChangeLog:
  # Reused fragments of the validator. Global, so the other families can read them.
  - property:
      name: uuid_field
      value: '{ "bsonType": "string", "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" }'
      global: true

  # The collection is created together with its first validator (06-data/models.md).
  # Any later validator change is a new changeset under 01_validators/ (collMod).
  - changeSet:
      id: sale-001-create-collection
      author: SergioAndres17
      preConditions:
        - onFail: MARK_RAN
        - not:
            - collectionExists:
                collectionName: sale
      changes:
        - createCollection:
            collectionName: sale
            options: |
              {
                "validationLevel": "strict",
                "validationAction": "error",
                "validator": {
                  "$jsonSchema": {
                    "bsonType": "object",
                    "additionalProperties": false,
                    "required": ["_id", "customerId", "createdBy", "date", "totalCents", "active", "idempotencyKey", "details"],
                    "properties": {
                      "_id": ${uuid_field},
                      "customerId": ${uuid_field},
                      "createdBy": ${uuid_field},
                      "date": { "bsonType": "date" },
                      "totalCents": { "bsonType": "long", "minimum": 0 },
                      "active": { "bsonType": "bool" },
                      "idempotencyKey": { "bsonType": "string", "minLength": 8, "maxLength": 128 },
                      "details": {
                        "bsonType": "array",
                        "minItems": 1,
                        "maxItems": 100,
                        "items": {
                          "bsonType": "object",
                          "additionalProperties": false,
                          "required": ["detailId", "productId", "quantity", "unitPriceCents", "subtotalCents", "active"],
                          "properties": {
                            "detailId": ${uuid_field},
                            "productId": ${uuid_field},
                            "quantity": { "bsonType": "int", "minimum": 1 },
                            "unitPriceCents": { "bsonType": "long", "minimum": 1 },
                            "subtotalCents": { "bsonType": "long", "minimum": 1 },
                            "active": { "bsonType": "bool" }
                          }
                        }
                      }
                    }
                  }
                }
              }
      rollback:
        - dropCollection:
            collectionName: sale

  # One counter document per year ("VEN-2026"), advanced atomically by the Sales API.
  # The validator makes the six-digit ceiling a database rule too: an increment past
  # 999999 is rejected instead of producing a longer number.
  - changeSet:
      id: sale-012-create-sale-counter
      author: SergioAndres17
      preConditions:
        - onFail: MARK_RAN
        - not:
            - collectionExists:
                collectionName: sale_counter
      changes:
        - createCollection:
            collectionName: sale_counter
            options: |
              {
                "validationLevel": "strict",
                "validationAction": "error",
                "validator": {
                  "$jsonSchema": {
                    "bsonType": "object",
                    "additionalProperties": false,
                    "required": ["_id", "seq"],
                    "properties": {
                      "_id": { "bsonType": "string", "pattern": "^VEN-[1-9][0-9]{3}$" },
                      "seq": { "bsonType": "long", "minimum": 0, "maximum": 999999 }
                    }
                  }
                }
              }
      rollback:
        - dropCollection:
            collectionName: sale_counter
